const loadRzp=()=>window.Razorpay?0:new Promise(r=>{const s=document.createElement('script');s.src='https://checkout.razorpay.com/v1/checkout.js';s.onload=r;document.head.append(s)});
async function reg(x){
  x.preventDefault();const b=x.target.querySelector('button');b.disabled=true;
  const r=await fetch('/api/register',J(Object.fromEntries(new FormData(x.target)))),o=await r.json();
  if(!r.ok){toast(o.error);b.disabled=false;return}
  const done=async p=>{const v=await fetch('/api/verify',J({regId:o.regId,...p}));
    $('#tix').innerHTML=v.ok?`<h3>Payment received</h3><p>Your registration is under review. We'll email <b>${esc(o.email)}</b> with the decision.</p>`:'<h3>Verification failed</h3><p>Contact the organizers with your payment ID.</p>'};
  if(o.demo)return done({razorpay_order_id:o.orderId,razorpay_payment_id:'pay_demo_'+o.regId,razorpay_signature:'demo'});
  await loadRzp();
  new Razorpay({key:o.keyId,order_id:o.orderId,amount:o.amount,currency:'INR',name:o.eventName,prefill:{name:o.name,email:o.email,contact:o.phone},theme:{color:'#0e5d4b'},handler:done,modal:{ondismiss:()=>b.disabled=false}}).open();
}

const A=async(p,m='GET',b)=>{const r=await fetch(p,{method:m,headers:{'x-admin-password':pw,'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)toast(j.error||'Something went wrong');return j};
async function upl(inp){const f=new FormData();f.append('file',inp.files[0]);const r=await fetch('/api/admin/upload',{method:'POST',headers:{'x-admin-password':pw},body:f}),j=await r.json();if(!r.ok){toast(j.error);return null}return j.url}
const F=[['name','Event name'],['tagline','Tagline'],['day','Date','date'],['t_start','Start (IST)','time'],['t_end','End (IST)','time'],['venue','Venue name'],['address','Venue address'],['price','Ticket price (₹)','number'],['capacity','Capacity','number']];
async function admin(){
  if(!pw){pw=prompt('Admin password')||'';sessionStorage.pw=pw}
  const r=await fetch('/api/admin/data',{headers:{'x-admin-password':pw}});
  if(r.status===401){sessionStorage.pw=pw='';toast('Wrong password');location.hash='';return}
  D=await r.json();draw();
}
function sync(){const v=k=>$('#f_'+k).value,e=D.event;F.forEach(([k])=>e[k]=v(k));e.price=Math.round(+v('price')*100);e.description=v('description');e.visibility=v('visibility')}
async function saveEv(){sync();await A('/api/admin/event','PUT',D.event);toast('Event saved')}
async function saveSp(){await A('/api/admin/speakers','PUT',D.speakers);toast('Speakers saved')}
async function banner(i){sync();const u=await upl(i);if(u){D.event.banner=u;draw()}}
function removeBanner(){sync();D.event.banner='';draw()}
async function photo(i,inp){sync();const u=await upl(inp);if(u){D.speakers[i].photo=u;draw()}}
function addSp(){sync();D.speakers.push({name:'',role:'',talk:'',photo:'',linkedin:''});draw()}
function delSp(i){sync();D.speakers.splice(i,1);draw()}
async function decide(id,d){if(!confirm(d==='accepted'?'Accept this registration and notify them?':'Decline, refund and send the declined receipt?'))return;const j=await A(`/api/admin/regs/${id}/decision`,'POST',{decision:d});if(j.ok){toast(d==='accepted'?'Accepted, email queued':'Declined, receipt sent');admin()}}
async function exportRegs(format){
  if(!D.regs.length)return;
  const r=await fetch(`/api/admin/regs/export?format=${format}`,{headers:{'x-admin-password':pw}});
  if(!r.ok){const j=await r.json().catch(()=>({}));toast(j.error||'Export failed');return}
  const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=`eventdesk-registrations.${format}`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
  toast(`Downloaded ${format.toUpperCase()} registration data`);
}
async function resetRegs(){
  if(!D.totalRegs){toast('There are no registration records to reset');return}
  if(!confirm('Reset all registration details? This permanently deletes all registration records and queued registration emails. This cannot be undone.'))return;
  if(!confirm('Please confirm once more: permanently clear ALL registration details?'))return;
  const j=await A('/api/admin/regs','DELETE');
  if(j.ok){toast('All registration details have been cleared');await admin()}
}
function draw(){
  const e=D.event,pend=D.regs.filter(r=>r.status==='pending_review').length;
  $('#app').innerHTML=`<h1>Organizer dashboard</h1><p><a href="#">← View public page</a></p>
  <section class="c"><h2>Registrations <small class="mu">(${pend} awaiting review)</small></h2><div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px"><button type="button" onclick="exportRegs('xlsx')" ${D.regs.length?'':'disabled'}>Export XLSX</button><button type="button" onclick="exportRegs('csv')" ${D.regs.length?'':'disabled'}>Export CSV</button><button type="button" class="no" onclick="resetRegs()" ${D.totalRegs?'':'disabled'}>Reset registrations</button></div><div class="scroll">${D.regs.length?`<table><tr><th>Name</th><th>Email</th><th>Company</th><th>Phone</th><th>Payment</th><th>Status</th><th></th></tr>${D.regs.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.email)}</td><td>${esc(r.company)}</td><td>${esc(r.phone)}</td><td>${esc(r.payment_id)}</td><td><span class="st ${r.status}">${r.status.replace('_',' ')}</span></td><td>${r.status==='pending_review'?`<button class="ok" onclick="decide(${r.id},'accepted')">Accept</button> <button class="no" onclick="decide(${r.id},'declined')">Decline</button>`:''}</td></tr>`).join('')}</table>`:'<p class="mu">No paid registrations yet. Register from the public page to test the flow.</p>'}</div></section>
  <section class="c"><h2>Event page</h2>
   <label>Banner image</label>${e.banner?`<img class="bthumb" src="${esc(e.banner)}" alt="Current banner"><div style="margin:6px 0 10px"><button type="button" class="no" onclick="removeBanner()">Remove current image</button></div>`:'<p class="mu">No banner image selected.</p>'}<label for="banner_upload">${e.banner?'Replace image':'Upload image'}</label><input id="banner_upload" type="file" accept="image/png,image/jpeg,image/webp,image/gif" onchange="banner(this)">
   <div class="row2">${F.map(([k,l,t])=>`<div><label for="f_${k}">${l}</label><input id="f_${k}" type="${t||'text'}" value="${esc(k==='price'?e.price/100:e[k])}"></div>`).join('')}</div>
   <label for="f_description">Description</label><textarea id="f_description">${esc(e.description)}</textarea>
   <label for="f_visibility">Who sees the attendee list?</label><select id="f_visibility">${[['public','Show full names (accepted only)'],['masked','Show masked names, e.g. P••••• S•••'],['count','Show only the count'],['hidden','Hide completely']].map(([v,l])=>`<option value="${v}" ${e.visibility===v?'selected':''}>${l}</option>`).join('')}</select>
   <button class="p inl" onclick="saveEv()">Save event</button></section>
  <section class="c"><h2>Speakers</h2>${D.speakers.map((s,i)=>`<div class="spk">${s.photo?`<img class="thumb" src="${esc(s.photo)}" alt="">`:'<div class="thumb"></div>'}<div>
   <div class="row2"><input placeholder="Name" value="${esc(s.name)}" oninput="D.speakers[${i}].name=this.value"><input placeholder="Role, company" value="${esc(s.role)}" oninput="D.speakers[${i}].role=this.value"></div>
   <input style="margin-top:8px" placeholder="Talk title" value="${esc(s.talk)}" oninput="D.speakers[${i}].talk=this.value">
   <input style="margin-top:8px" placeholder="LinkedIn URL (https://linkedin.com/in/…)" value="${esc(s.linkedin)}" oninput="D.speakers[${i}].linkedin=this.value">
   <div style="margin-top:8px"><input type="file" accept="image/*" onchange="photo(${i},this)" style="width:auto"> <button class="no" onclick="delSp(${i})">Remove</button></div></div></div>`).join('')}
   <button onclick="addSp()">Add speaker</button> <button class="p inl" onclick="saveSp()">Save speakers</button></section>`;
}
</script></body></html>
